[workspace]

[package]
name = "cross_dex_volume"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
substreams = "0.7"
substreams-ethereum = "0.11"
prost = "0.13"
prost-types = "0.13"
hex = "0.4"
hex-literal = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
ethabi = "18"

[build-dependencies]
substreams-ethereum = "0.11"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
